buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace "com.shockwave.pdfium"
    compileSdk 34

    defaultConfig {
        minSdk 21  // Updated from 19 to support modern NDK for 16KB pages
        targetSdk 34
        versionCode 1
        versionName "1.9.3-16kb"  // Updated version to indicate 16KB support
        buildConfigField 'String', 'VERSION_NAME', "\"${defaultConfig.versionName}\""

        // Explicitly filter ABIs for both packaging and NDK builds
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            ndkBuild {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Ensure Java 8 bytecode for Android consumers
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Add NDK build to compile JNI bridge with new pdfium library (ARM only)
    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
            buildStagingDirectory 'build/ndk-build'
        }
    }

    sourceSets{
        main {
            // Use modern jniLibs approach for prebuilt .so files
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // JitPack publishing configuration
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

// JitPack publishing configuration
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'education.honor'  // Replace with your GitHub username
                artifactId = 'pdfium-android-16kb'
                version = android.defaultConfig.versionName

                pom {
                    name = 'PdfiumAndroid 16KB'
                    description = 'Android PDF renderer with 16KB page size support'
                    url = 'https://github.com/HonorEd-Technologies/PdfiumAndroid'  // Replace with your repo URL

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }

                    scm {
                        connection = 'scm:git:git@github.com:HonorEd-Technologies/PdfiumAndroid.git'
                        developerConnection = 'scm:git:ssh://github.com:HonorEd-Technologies/PdfiumAndroid.git'
                        url = 'https://github.com/HonorEd-Technologies/PdfiumAndroid'
                    }
                }
            }
        }
    }
}
